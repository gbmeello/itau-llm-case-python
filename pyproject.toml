[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "purchase-approval-agent"
version = "0.1.0"
description = "Agente LLM de aprovação de solicitações de compra (case Itaú - LLM Engineering)"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.12.0",
    "fastapi==0.142.4",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "jsonschema==4.26.0",
    "sqlalchemy==2.1.4",
    "prometheus-client==0.26.0",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
postgres = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
purchase_agent = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["eval: golden set (rode com `pytest -m eval`)"]
addopts = "-m 'not eval' -q"
