name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Testes (unitários + integração + MCP, LLM fake)
        run: pytest
      - name: Golden set contra LLM fake (gate de pipeline/guardrails)
        run: pytest -m eval
      - name: Relatório de eval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/

  # Eval com o Claude real: manual, para não gastar tokens em todo push. Requer o secret ANTHROPIC_API_KEY.
  eval-real:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -m eval
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # Ambiente completo em containers: Postgres + servidor MCP + API (ERP via MCP) + Prometheus.
  docker-compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar regras de alerta (promtool)
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/p" --entrypoint promtool prom/prometheus:v3.13.4 \
            check rules /p/alerts.yml
      - name: Subir o ambiente
        run: docker compose up -d --build
      - name: Aguardar a API
        run: |
          for i in $(seq 1 60); do curl -fs localhost:8080/health && exit 0; sleep 2; done
          docker compose logs; exit 1
      - name: Demo ponta a ponta (ERP via MCP, persistência em Postgres)
        run: |
          ./scripts/demo.sh
          curl -fs localhost:8080/health | grep '"erpSource":"mcp"'
          test "$(grep -o '"decision":"APPROVE"' examples/responses/01-approve.json | head -1)" = '"decision":"APPROVE"'
          test "$(grep -o '"decidedBy":"RULE_ENGINE"' examples/responses/04-blocked-supplier.json | head -1)" = '"decidedBy":"RULE_ENGINE"'
      - name: Prometheus coletando métricas do agente
        run: |
          for i in $(seq 1 30); do
            curl -fs 'localhost:9090/api/v1/query?query=agent_decisions_total' | grep -q '"result":\[{' && exit 0; sleep 3
          done
          exit 1
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
